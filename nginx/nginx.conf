events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_analytics '{"time": "$time_local", '
                             '"remote_addr": "$remote_addr", '
                             '"request": "$request", '
                             '"status": "$status", '
                             '"body_bytes_sent": "$body_bytes_sent", '
                             '"request_time": "$request_time", '
                             '"http_referrer": "$http_referer"}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    map $http_host $https_port {
        default 8443;
        "~^(.+):(\d+)$" "8443";
    }                                        # <-- ЗАКРЫВАЮЩАЯ СКОБКА MAP

    # 1. СЛУШАТЕЛЬ HTTP (Внутренний 80, внешний 8080)
    server {
        listen 80;
        server_name _;

        return 301 https://$host:$https_port$request_uri;
    }

    # 2. СЛУШАТЕЛЬ HTTPS (Внутренний 443, внешний 8443) — ТЕРМИНАЦИЯ TLS
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/ca.crt;
        ssl_certificate_key /etc/nginx/ssl/ca.key;

        ssl_ciphers GOST2012-KUZNYECHIK-KUZNYECHIKOMAC:GOST2012-GOST8912-GOST8912;
        ssl_protocols TLSv1.2;
        ssl_prefer_server_ciphers on;

        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            set $upstream esia-gateway-service:8080;
            proxy_pass http://$upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect http:// $scheme://;
        }
    }
}